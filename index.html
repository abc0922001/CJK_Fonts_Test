<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="text-scale" content="scale">
  <title>漢字五方：CJK 跨地域字形差異展示與即時測試</title>
  <style>
    :root {
      color-scheme: light;

      --bg: #f8fafc;
      --card-bg: #ffffff;
      --surface-subtle: #f1f5f9;
      --card-border: #cbd5e1;
      --control-border: #64748b;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-body: #334155;
      --accent: #0369a1;
      --accent-text: #ffffff;
      --btn-bg: #ffffff;
      --btn-hover-bg: #e2e8f0;

      accent-color: var(--accent);
    }

    :where(html, body, h1, h2, h3, p, ul, li, section, header, main, button, input) {
      box-sizing: border-box;
    }

    :where(body, h1, h2, h3, p, ul) {
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: sans-serif;
      line-height: 1.5;
      padding-block: 1.5rem 3rem;
      padding-inline: 1rem;
    }

    .container {
      max-inline-size: 75rem;
      margin-inline: auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
      margin-block-end: 1.5rem;
      border-block-end: 1px solid var(--card-border);
      padding-block-end: 1rem;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--accent);
      margin-block-end: 0.375rem;
      text-wrap: balance;
    }

    p.desc {
      color: var(--text-sub);
      font-size: 0.9rem;
      max-inline-size: 65ch;
      text-wrap: pretty;
    }

    .toolbar {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      background: var(--btn-bg);
      color: var(--text-main);
      border: 1px solid var(--control-border);
      padding-block: 0.5rem;
      padding-inline: 0.875rem;
      min-block-size: 2.5rem;
      min-inline-size: 2.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.88rem;
      font-family: inherit;
    }

    @media (pointer: coarse) {
      button {
        min-block-size: 2.75rem;
      }
    }

    @media (hover: hover) {
      button:hover:not([aria-pressed="true"]) {
        background: var(--btn-hover-bg);
      }
    }

    button[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
      font-weight: 700;
    }

    :where(button, input[type="text"], input[type="range"]):focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: no-preference) {
      button,
      .input-wrapper input[type="text"] {
        transition: background-color 0.15s, border-color 0.15s, color 0.15s;
      }
    }

    /* 自訂文字即時測試區塊 */
    .custom-tester {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 1.25rem;
      margin-block-end: 1.75rem;
    }

    .tester-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      margin-block-end: 1rem;
    }

    .input-wrapper {
      flex: 1 1 16rem;
      min-inline-size: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.625rem;
    }

    .input-wrapper label {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
    }

    .input-wrapper input[type="text"] {
      flex: 1 1 14rem;
      min-inline-size: 0;
      background: var(--surface-subtle);
      border: 1px solid var(--control-border);
      color: var(--text-main);
      padding-block: 0.625rem;
      padding-inline: 0.875rem;
      min-block-size: 2.5rem;
      border-radius: 6px;
      font-size: 1.15rem;
      font-family: inherit;
    }

    .size-wrapper {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.88rem;
      color: var(--text-sub);
    }

    .size-wrapper input[type="range"] {
      cursor: pointer;
      min-block-size: 2.5rem;
    }

    .live-preview-grid {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0.75rem;
      --test-size: 48px;
    }

    @media (max-width: 56.25em) {
      .live-preview-grid {
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 11.25rem), 1fr));
      }
    }

    .live-card {
      background: var(--surface-subtle);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-block-size: 7.5rem;
    }

    .live-card-header {
      inline-size: 100%;
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: var(--text-sub);
      border-block-end: 1px solid var(--card-border);
      padding-block-end: 0.375rem;
      margin-block-end: 0.75rem;
    }

    .live-card-header code {
      color: var(--accent);
      font-weight: 700;
    }

    .live-glyph-text {
      font-size: var(--test-size);
      word-break: break-all;
      line-height: 1.25;
      margin-block: auto;
      user-select: all;
    }

    /* 區塊標題 */
    h2.section-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      margin-block-end: 0.875rem;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.625rem;
      text-wrap: balance;
    }

    h2.section-title span.sub {
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--text-sub);
    }

    /* 差異字展示列 */
    .char-showcase {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .char-row {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 1rem;
      display: grid;
      grid-template-columns: 14.375rem 1fr;
      gap: 1rem;
      align-items: center;
    }

    /* 僅對初始視口以下的圖鑑卡片延遲渲染 */
    .char-row:nth-child(n + 5) {
      content-visibility: auto;
      contain-intrinsic-size: auto none auto 11rem;
    }

    @media (max-width: 51.25em) {
      .char-row {
        grid-template-columns: 1fr;
      }
    }

    .char-info {
      border-inline-end: 1px solid var(--card-border);
      padding-inline-end: 1rem;
    }

    @media (max-width: 51.25em) {
      .char-info {
        border-inline-end: none;
        border-block-end: 1px solid var(--card-border);
        padding-inline-end: 0;
        padding-block-end: 0.75rem;
      }
    }

    .char-info .title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      margin-block-end: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .char-info .unicode {
      font-size: 0.78rem;
      font-family: monospace;
      color: var(--text-sub);
      background: var(--surface-subtle);
      border: 1px solid var(--card-border);
      padding-block: 0.125rem;
      padding-inline: 0.375rem;
      border-radius: 4px;
    }

    .char-info .feature-desc {
      font-size: 0.85rem;
      color: var(--text-body);
      margin-block-start: 0.375rem;
      text-wrap: pretty;
    }

    .region-boxes {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0.625rem;
    }

    @media (max-width: 37.5em) {
      .region-boxes {
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 6rem), 1fr));
      }
    }

    .region-card {
      background: var(--surface-subtle);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding-block: 0.625rem;
      padding-inline: 0.375rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .region-label {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-block-end: 0.375rem;
      display: flex;
      gap: 0.25rem;
      align-items: center;
    }

    .region-label code {
      color: var(--accent);
      font-weight: 700;
    }

    .glyph-display {
      font-size: 4.5rem;
      line-height: 1.1;
      margin-block: 0.25rem;
      user-select: all;
    }

    .preview-scope[data-font-family="sans-serif"] :is(.live-glyph-text, .glyph-display) {
      font-family: sans-serif;
    }

    .preview-scope[data-font-family="serif"] :is(.live-glyph-text, .glyph-display) {
      font-family: serif;
    }

    .region-note {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-block-start: 0.375rem;
    }

    @media (forced-colors: active) {
      button[aria-pressed="true"] {
        background: Highlight;
        color: HighlightText;
        border-color: Highlight;
        forced-color-adjust: none;
      }

      .live-card,
      .region-card,
      .custom-tester,
      .char-row {
        border: 1px solid CanvasText;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>漢字五方：CJK 跨地域字形一覽與即時測試</h1>
        <p class="desc">
          不指定任何特定字型名稱，純粹透過 HTML 原生 <code>lang</code> 屬性（<code>zh-TW</code> / <code>zh-CN</code> / <code>ja</code> / <code>ko</code> / <code>zh-HK</code>）展示五地書寫差異。
        </p>
      </div>
      <div class="toolbar" role="toolbar" focusgroup="toolbar wrap" aria-label="字體類別切換" aria-controls="preview-root">
        <button id="btn-sans" type="button" aria-pressed="true" data-family="sans-serif">無襯線黑體 (sans-serif)</button>
        <button id="btn-serif" type="button" aria-pressed="false" data-family="serif">有襯線明/宋體 (serif)</button>
      </div>
    </header>

    <main id="preview-root" class="preview-scope" data-font-family="sans-serif">
      <!-- 自訂文字即時測試面板 -->
      <section class="custom-tester">
        <div class="tester-controls">
          <div class="input-wrapper">
            <label for="custom-input">自訂測試文字：</label>
            <input type="text" id="custom-input" value="遲眾聽經亮以角沒化骨麵房空" placeholder="請輸入任意漢字進行五地字形比對...">
          </div>
          <div class="size-wrapper">
            <label for="size-slider">字級大小：</label>
            <input type="range" id="size-slider" min="28" max="110" value="48" aria-valuetext="48px">
            <span id="size-val">48px</span>
          </div>
        </div>
        <ul id="live-grid" class="live-preview-grid"></ul>
      </section>

      <!-- 20 組經典 CJK 差異漢字一覽 -->
      <section>
        <h2 class="section-title">
          <span>代表性漢字五地書寫差異圖鑑（共 20 字）</span>
          <span class="sub">點擊卡片內文字可直接選取複製</span>
        </h2>
        <ul id="showcase-container" class="char-showcase"></ul>
      </section>
    </main>
  </div>

  <script>
    const REGIONS = [
      { code: 'zh-TW', label: '台灣' },
      { code: 'zh-CN', label: '中國' },
      { code: 'ja',    label: '日本' },
      { code: 'ko',    label: '韓國' },
      { code: 'zh-HK', label: '香港' }
    ];

    // 精選 20 個同一個 Unicode 碼位、但在台/中/日/韓/港有鮮明筆形差異的代表字

        notes: {

          'zh-CN': '上內左折・下首筆豎',
          'ja':    '上內左折・下首筆豎',
          'ko':    '上內右折・下首筆撇',
          'zh-HK': '上內右折・下首筆撇'
        }
      },
      {

        code: 'U+89D2',
        feature: '下半部「用」中央的豎筆是否向下穿透底橫',

        feature: '雨字頭內部四點方向與下方「彐」字形',
        notes: {
          'zh-TW': '四點斜向・中橫不出頭',
          'zh-CN': '四點短橫・中橫不出頭',
          'ja':    '中橫不穿透右折',
          'ko':    '傳統雨頭・右折微出',
          'zh-HK': '傳統雨頭點畫'
        }
      },
      {
        char: '器',
        code: 'U+5668',
        feature: '中央部位是「犬（有一點）」還是「大（無點）」',
        notes: {
          'zh-TW': '中央為「犬」（有右點）',
          'zh-CN': '中央為「大」（無點）',
          'ja':    '中央為「大」（無點）',
          'ko':    '中央為「犬」（有右點）',
          'zh-HK': '中央為「犬」（有右點）'
        }
      },
      {
        char: '真',
        code: 'U+771F',
        feature: '上方是「十」或「匕」，以及內部與左豎連結關係',
        notes: {
          'zh-TW': '上為十・下橫直接連目',
          'zh-CN': '上為十・下橫直接連目',
          'ja':    '上為十・左側帶豎折框',
          'ko':    '傳統常作眞（上匕）',
          'zh-HK': '上為十・左側帶豎折框'
        }
      },
      {
        char: '道',
        code: 'U+9053',
        feature: '走之底（辶）左側點畫數與首部「首」內筆形',
        notes: {
          'zh-TW': '一點・下方雙折彎',
          'zh-CN': '一點・橫折折撇',
          'ja':    '一點・平滑單折彎',
          'ko':    '二點（傳統雙點辶）',
          'zh-HK': '一點・傳統書寫折彎'
        }
      }
    ];

    function createEl(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    function initLiveTester(initialText) {
      const grid = document.getElementById('live-grid');
      const fragment = document.createDocumentFragment();
      const glyphNodes = [];

      for (const r of REGIONS) {
        const card = createEl('li', 'live-card');
        const header = createEl('div', 'live-card-header');
        header.append(
          createEl('span', '', `${r.label}標準`),
          createEl('code', '', `lang="${r.code}"`)
        );

        const glyph = createEl('div', 'live-glyph-text', initialText);
        glyph.lang = r.code;
        glyphNodes.push(glyph);

        card.append(header, glyph);
        fragment.append(card);
      }

      grid.append(fragment);
      return glyphNodes;
    }

    function initShowcase() {
      const container = document.getElementById('showcase-container');
      const fragment = document.createDocumentFragment();

      for (const item of CHAR_DATA) {
        const row = createEl('li', 'char-row');

        const info = createEl('div', 'char-info');
        const title = createEl('h3', 'title');
        title.append(
          createEl('span', '', `「${item.char}」`),
          createEl('span', 'unicode', item.code)
        );
        info.append(title, createEl('div', 'feature-desc', item.feature));

        const boxes = createEl('ul', 'region-boxes');
        for (const r of REGIONS) {
          const card = createEl('li', 'region-card');
          const label = createEl('div', 'region-label');
          label.append(createEl('span', '', r.label), createEl('code', '', r.code));

          const glyph = createEl('div', 'glyph-display', item.char);
          glyph.lang = r.code;

          card.append(label, glyph, createEl('div', 'region-note', item.notes[r.code]));
          boxes.append(card);
        }

        row.append(info, boxes);
        fragment.append(row);
      }

      container.append(fragment);
    }

    function setupToolbar(previewRoot) {
      const toolbar = document.querySelector('[role="toolbar"]');
      const buttons = Array.from(toolbar.querySelectorAll('button[data-family]'));

      function selectFamily(targetBtn) {
        const family = targetBtn.dataset.family;
        previewRoot.dataset.fontFamily = family;
        for (const btn of buttons) {
          btn.setAttribute('aria-pressed', String(btn === targetBtn));
        }
      }

      for (const btn of buttons) {
        btn.addEventListener('click', () => selectFamily(btn));
      }

      if (!('focusGroup' in HTMLElement.prototype)) {
        buttons.forEach((b, i) => {
          b.tabIndex = i === 0 ? 0 : -1;
        });

        toolbar.addEventListener('focusin', ({ target }) => {
          if (!buttons.includes(target)) return;
          for (const b of buttons) {
            b.tabIndex = b === target ? 0 : -1;
          }
        });

        toolbar.addEventListener('keydown', (e) => {
          const idx = buttons.indexOf(document.activeElement);
          if (idx === -1) return;

          const rtl = getComputedStyle(toolbar).direction === 'rtl';
          const steps = {
            ArrowRight: rtl ? -1 : 1,
            ArrowLeft: rtl ? 1 : -1
          };

          let nextIdx = null;
          if (e.key in steps) {
            nextIdx = (idx + steps[e.key] + buttons.length) % buttons.length;
          } else if (e.key === 'Home') {
            nextIdx = 0;
          } else if (e.key === 'End') {
            nextIdx = buttons.length - 1;
          }

          if (nextIdx !== null) {
            e.preventDefault();
            buttons[nextIdx].focus();
          }
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const previewRoot = document.getElementById('preview-root');
      const liveGrid = document.getElementById('live-grid');
      const inputEl = document.getElementById('custom-input');
      const sliderEl = document.getElementById('size-slider');
      const sizeValEl = document.getElementById('size-val');

      const glyphNodes = initLiveTester(inputEl.value || '骨');
      initShowcase();
      setupToolbar(previewRoot);

      inputEl.addEventListener('input', () => {
        const text = inputEl.value || '骨';
        for (const node of glyphNodes) {
          node.textContent = text;
        }
      });

      sliderEl.addEventListener('input', () => {
        const sizePx = `${sliderEl.value}px`;
        liveGrid.style.setProperty('--test-size', sizePx);
        sizeValEl.textContent = sizePx;
        sliderEl.setAttribute('aria-valuetext', sizePx);
      });
    });
  </script>
</body>
</html>
