<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漢字五方：CJK 跨地域字形一覽與本機字體檢測</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --danger: #f43f5e;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      padding: 20px 14px 40px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
    }

    p.desc {
      color: var(--text-sub);
      font-size: 0.9rem;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      background: #334155;
      color: var(--text-main);
      border: 1px solid #475569;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.88rem;
      transition: all 0.15s;
    }

    button:hover {
      background: #475569;
    }

    button.active {
      background: var(--accent);
      color: #090d16;
      border-color: var(--accent);
      font-weight: 700;
    }

    /* 診斷報告區塊 */
    .diagnostic-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 24px;
    }

    .diag-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .diag-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .status-badge.ok {
      background: rgba(16, 185, 129, 0.18);
      color: var(--success);
      border: 1px solid var(--success);
    }

    .status-badge.warn {
      background: rgba(245, 158, 11, 0.18);
      color: var(--warning);
      border: 1px solid var(--warning);
    }

    .status-badge.danger {
      background: rgba(244, 63, 94, 0.18);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .matrix-item {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .diag-summary-text {
      font-size: 0.88rem;
      color: #cbd5e1;
      background: #090d16;
      padding: 10px 14px;
      border-radius: 6px;
      border-left: 4px solid var(--accent);
    }

    /* 差異字展示列 */
    .char-showcase {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .char-row {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 16px;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 16px;
      align-items: center;
    }

    @media (max-width: 820px) {
      .char-row {
        grid-template-columns: 1fr;
      }
    }

    .char-info {
      border-right: 1px solid var(--card-border);
      padding-right: 16px;
    }

    @media (max-width: 820px) {
      .char-info {
        border-right: none;
        border-bottom: 1px solid var(--card-border);
        padding-right: 0;
        padding-bottom: 12px;
      }
    }

    .char-info .title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .char-info .unicode {
      font-size: 0.78rem;
      font-family: monospace;
      color: var(--text-sub);
      background: #090d16;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .char-info .feature-desc {
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-top: 6px;
    }

    .region-boxes {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    @media (max-width: 600px) {
      .region-boxes {
        grid-template-columns: repeat(auto-fit, minmax(95px, 1fr));
      }
    }

    .region-card {
      background: #090d16;
      border: 1px solid #263349;
      border-radius: 8px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .region-label {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 6px;
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .region-label code {
      color: var(--accent);
      font-weight: 700;
    }

    .glyph-display {
      font-size: 72px;
      line-height: 1.1;
      margin: 4px 0;
      user-select: all;
    }

    .font-sans {
      font-family: sans-serif !important;
    }

    .font-serif {
      font-family: serif !important;
    }

    .region-note {
      font-size: 0.74rem;
      color: #94a3b8;
      margin-top: 6px;
    }

    /* 掛載於 DOM 的隱藏檢測用畫布 */
    #hidden-probe-container {
      position: fixed;
      left: -9999px;
      top: -9999px;
      pointer-events: none;
      opacity: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>漢字五方：CJK 跨地域字形一覽與本機字體檢測</h1>
        <p class="desc">
          不指定任何特定字型名稱，純粹透過 HTML 原生 <code>lang</code> 屬性（<code>zh-TW</code> / <code>zh-CN</code> / <code>ja</code> / <code>ko</code> / <code>zh-HK</code>）直接展示五地書寫差異並檢測系統字體支援度。
        </p>
      </div>
      <div class="toolbar">
        <button id="btn-sans" class="active" onclick="setGenericFamily('sans-serif')">無襯線黑體 (sans-serif)</button>
        <button id="btn-serif" onclick="setGenericFamily('serif')">有襯線明/宋體 (serif)</button>
      </div>
    </header>

    <!-- 自動本機字體診斷面板 -->
    <section class="diagnostic-panel">
      <div class="diag-header">
        <div class="diag-title">
          <span>裝置原生 CJK 語系字體獨立性診斷</span>
          <span id="diag-badge" class="status-badge">檢測中...</span>
        </div>
        <button onclick="runFontDiagnostics()">重新檢測</button>
      </div>
      <div id="diag-matrix" class="matrix-grid"></div>
      <div id="diag-conclusion" class="diag-summary-text"></div>
    </section>

    <!-- 10 組經典 CJK 差異漢字一覽 -->
    <main id="showcase-container" class="char-showcase"></main>
  </div>

  <!-- 必須實際掛載於 DOM 樹中，瀏覽器才會針對 lang 屬性切換系統字體 -->
  <div id="hidden-probe-container">
    <canvas id="probe-canvas" width="96" height="96"></canvas>
  </div>

  <script>
    let currentFamily = 'sans-serif';

    // 精選 10 個同一個 Unicode 碼位、但在台/中/日/韓/港有鮮明筆形差異的代表字
    const CHAR_DATA = [
      {
        char: '骨',
        code: 'U+9AA8',
        feature: '上方骨頭內部方向與下方「月（肉）」首筆',
        notes: {
          'zh-TW': '上內右折・下首筆豎',
          'zh-CN': '上內左折・下首筆豎',
          'ja':    '上內左折・下首筆豎',
          'ko':    '上內右折・下首筆撇',
          'zh-HK': '上內右折・下首筆撇'
        }
      },
      {
        char: '直',
        code: 'U+76F4',
        feature: '下方末筆長橫與左側豎筆的組合結構',
        notes: {
          'zh-TW': '下橫與上目相連無左豎',
          'zh-CN': '下橫與上目相連無左豎',
          'ja':    '左側帶L形豎折托底',
          'ko':    '左側帶L形豎折托底',
          'zh-HK': '左側帶L形豎折托底'
        }
      },
      {
        char: '角',
        code: 'U+89D2',
        feature: '下半部「用」中央的豎筆是否向下穿透第2橫',
        notes: {
          'zh-TW': '中豎不穿透底橫',
          'zh-CN': '中豎向下穿透出頭',
          'ja':    '中豎不穿透底橫',
          'ko':    '中豎不穿透底橫',
          'zh-HK': '中豎不穿透底橫'
        }
      },
      {
        char: '刃',
        code: 'U+5203',
        feature: '左側點畫與刀部撇畫的交接方式',
        notes: {
          'zh-TW': '點向右下（不穿撇）',
          'zh-CN': '點向右下穿過撇畫',
          'ja':    '左側為短右斜點',
          'ko':    '點穿過撇畫',
          'zh-HK': '點向右下（不穿撇）'
        }
      },
      {
        char: '草',
        code: 'U+8349',
        feature: '上方「艹（艸部）」是相連還是斷開為十十',
        notes: {
          'zh-TW': '四畫斷開（十＋十）',
          'zh-CN': '三畫一體橫連',
          'ja':    '三畫一體橫連',
          'ko':    '四畫傳統兩段式',
          'zh-HK': '四畫傳統兩段式'
        }
      },
      {
        char: '雪',
        code: 'U+96EA',
        feature: '雨字頭內部四點方向與下方「彐」字形',
        notes: {
          'zh-TW': '四點斜向・中橫不出頭',
          'zh-CN': '四點短橫・中橫不出頭',
          'ja':    '中橫不穿透右折',
          'ko':    '傳統雨頭・右折微出',
          'zh-HK': '傳統雨頭點畫'
        }
      },
      {
        char: '器',
        code: 'U+5668',
        feature: '中央部位是「犬（有一點）」還是「大（無點）」',
        notes: {
          'zh-TW': '中央為「犬」（有右點）',
          'zh-CN': '中央為「大」（無點）',
          'ja':    '中央為「大」（無點）',
          'ko':    '中央為「犬」（有右點）',
          'zh-HK': '中央為「犬」（有右點）'
        }
      },
      {
        char: '真',
        code: 'U+771F',
        feature: '上方是「十」或「匕」，以及內部與左豎連結關係',
        notes: {
          'zh-TW': '上為十・下橫直接連目',
          'zh-CN': '上為十・下橫直接連目',
          'ja':    '上為十・左側帶豎折框',
          'ko':    '傳統常作眞（上匕）',
          'zh-HK': '上為十・左側帶豎折框'
        }
      },
      {
        char: '空',
        code: 'U+7A7A',
        feature: '穴字頭下方兩筆是「八（撇、點）」還是「儿（撇、豎彎）」',
        notes: {
          'zh-TW': '穴下為「八」（撇＋長頓點）',
          'zh-CN': '穴下為「儿」（撇＋豎折鉤）',
          'ja':    '穴下為「儿」（撇＋豎彎）',
          'ko':    '穴下為「八」（撇＋點）',
          'zh-HK': '穴下為「八」（撇＋點）'
        }
      },
      {
        char: '道',
        code: 'U+9053',
        feature: '走之底（辶）左側點畫數與彎折造形',
        notes: {
          'zh-TW': '一點・下方雙折彎',
          'zh-CN': '一點・橫折折撇',
          'ja':    '一點・平滑單折彎',
          'ko':    '二點（傳統雙點辶）',
          'zh-HK': '一點・傳統書寫折彎'
        }
      }
    ];

    const REGIONS = [
      { code: 'zh-TW', label: '台灣' },
      { code: 'zh-CN', label: '中國' },
      { code: 'ja',    label: '日本' },
      { code: 'ko',    label: '韓國' },
      { code: 'zh-HK', label: '香港' }
    ];

    function renderShowcase() {
      const container = document.getElementById('showcase-container');
      const familyClass = currentFamily === 'sans-serif' ? 'font-sans' : 'font-serif';

      container.innerHTML = CHAR_DATA.map(item => {
        const cardsHtml = REGIONS.map(r => `
          <div class="region-card">
            <div class="region-label">
              <span>${r.label}</span>
              <code>${r.code}</code>
            </div>
            <div class="glyph-display ${familyClass}" lang="${r.code}">${item.char}</div>
            <div class="region-note">${item.notes[r.code]}</div>
          </div>
        `).join('');

        return `
          <div class="char-row">
            <div class="char-info">
              <div class="title">
                <span>「${item.char}」</span>
                <span class="unicode">${item.code}</span>
              </div>
              <div class="feature-desc">${item.feature}</div>
            </div>
            <div class="region-boxes">
              ${cardsHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    function setGenericFamily(family) {
      currentFamily = family;
      document.getElementById('btn-sans').classList.toggle('active', family === 'sans-serif');
      document.getElementById('btn-serif').classList.toggle('active', family === 'serif');
      renderShowcase();
      runFontDiagnostics();
    }

    /**
     * 將 Canvas 實際掛載於 DOM 並動態指定 lang 屬性與強制重新計算樣式，
     * 同時一次繪製多個差異字（「骨直角刃道草空器」）來提取精準像素簽章。
     */
    function captureLangCanvasData(langCode, family) {
      const canvas = document.getElementById('probe-canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      // 關鍵步驟：設定 DOM 上的 lang 屬性與通用字族，並讀取 computedStyle 強迫瀏覽器更新語系字體映射
      canvas.setAttribute('lang', langCode);
      canvas.style.fontFamily = family;
      void window.getComputedStyle(canvas).fontFamily;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff';
      ctx.textBaseline = 'top';
      ctx.font = `36px ${family}`;

      // 分兩行繪製 4 個最具鑑別度的漢字：骨、直、角、道
      ctx.fillText('骨直', 4, 4);
      ctx.fillText('角道', 4, 46);

      return ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    }

    function countPixelDifferences(dataA, dataB) {
      let diff = 0;
      for (let i = 3; i < dataA.length; i += 4) {
        if (Math.abs(dataA[i] - dataB[i]) > 15) {
          diff++;
        }
      }
      return diff;
    }

    function runFontDiagnostics() {
      const matrixEl = document.getElementById('diag-matrix');
      const badgeEl = document.getElementById('diag-badge');
      const conclusionEl = document.getElementById('diag-conclusion');

      const snapshots = {};
      REGIONS.forEach(r => {
        snapshots[r.code] = captureLangCanvasData(r.code, currentFamily);
      });

      // 檢測 6 組關鍵配對，能完整看出哪些語系獨立、哪些語系共用
      const comparisons = [
        { a: 'zh-TW', b: 'zh-CN', title: '台灣 vs 中國' },
        { a: 'zh-TW', b: 'ja',    title: '台灣 vs 日本' },
        { a: 'zh-TW', b: 'ko',    title: '台灣 vs 韓國' },
        { a: 'zh-TW', b: 'zh-HK', title: '台灣 vs 香港' },
        { a: 'zh-CN', b: 'ja',    title: '中國 vs 日本' },
        { a: 'ja',    b: 'ko',    title: '日本 vs 韓國' }
      ];

      let diffPairsCount = 0;
      matrixEl.innerHTML = comparisons.map(pair => {
        const diffPixels = countPixelDifferences(snapshots[pair.a], snapshots[pair.b]);
        const isDifferent = diffPixels > 0;
        if (isDifferent) diffPairsCount++;

        return `
          <div class="matrix-item">
            <span><strong>${pair.title}</strong></span>
            <span style="color: ${isDifferent ? 'var(--success)' : 'var(--warning)'}; font-weight: 700;">
              ${isDifferent ? `✓ 字形獨立 (差異 ${diffPixels} px)` : `＝ 字形相同 (共用回退)`}
            </span>
          </div>
        `;
      }).join('');

      // 統計 5 個語系總共產生了幾種獨特的字形渲染結果
      const uniqueGroups = [];
      REGIONS.forEach(r => {
        const matchedGroup = uniqueGroups.find(g => countPixelDifferences(g.data, snapshots[r.code]) === 0);
        if (matchedGroup) {
          matchedGroup.members.push(`${r.label}(${r.code})`);
        } else {
          uniqueGroups.push({
            data: snapshots[r.code],
            members: [`${r.label}(${r.code})`]
          });
        }
      });

      const uniqueCount = uniqueGroups.length;
      const groupSummary = uniqueGroups.map((g, idx) => `第 ${idx + 1} 組：[${g.members.join('、')}]`).join(' ； ');

      if (uniqueCount === 1) {
        badgeEl.className = 'status-badge danger';
        badgeEl.textContent = `單一字體強制回退 (1/5 種字形)`;
        conclusionEl.innerHTML = `<strong>診斷結論：</strong> 您的裝置在 <code>${currentFamily}</code> 模式下，對五個地區標籤渲染出完全相同的像素（${groupSummary}）。這代表系統強制使用單一字體顯示所有 CJK 漢字，或瀏覽器固定將所有語系指向同一套替換字體。`;
      } else if (uniqueCount >= 4) {
        badgeEl.className = 'status-badge ok';
        badgeEl.textContent = `多語系支援完整 (${uniqueCount}/5 種獨立字形)`;
        conclusionEl.innerHTML = `<strong>診斷結論：</strong> 您的裝置具備優良的 CJK 語系字體支援！在五個地區中共呈現出 <strong>${uniqueCount} 種獨立字形</strong>（分組狀態：${groupSummary}）。`;
      } else {
        badgeEl.className = 'status-badge warn';
        badgeEl.textContent = `部分語系獨立 (${uniqueCount}/5 種獨立字形)`;
        conclusionEl.innerHTML = `<strong>診斷結論：</strong> 您的裝置具備基本的 CJK 多語系區分能力，共呈現出 <strong>${uniqueCount} 種不同字形</strong>，但部分地區共用同一套字體（分組狀態：${groupSummary}）。`;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderShowcase();
      // 給予瀏覽器初次排版微幅緩衝後執行像素診斷
      requestAnimationFrame(() => {
        runFontDiagnostics();
      });
    });
  </script>
</body>
</html>
