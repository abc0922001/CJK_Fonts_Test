<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漢字五方：CJK 跨地域字形差異展示與即時測試</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: sans-serif;
      line-height: 1.5;
      padding: 24px 16px 48px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
    }

    p.desc {
      color: var(--text-sub);
      font-size: 0.9rem;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      background: #334155;
      color: var(--text-main);
      border: 1px solid #475569;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.88rem;
      transition: all 0.15s;
    }

    button:hover {
      background: #475569;
    }

    button.active {
      background: var(--accent);
      color: #090d16;
      border-color: var(--accent);
      font-weight: 700;
    }

    /* 自訂文字即時測試區塊 */
    .custom-tester {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 28px;
    }

    .tester-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
    }

    .input-wrapper {
      flex: 1;
      min-width: 260px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input-wrapper label {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }

    .input-wrapper input[type="text"] {
      width: 100%;
      background: #090d16;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 1.15rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-wrapper input[type="text"]:focus {
      border-color: var(--accent);
    }

    .size-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      color: var(--text-sub);
    }

    .size-wrapper input[type="range"] {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .live-preview-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    @media (max-width: 900px) {
      .live-preview-grid {
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      }
    }

    .live-card {
      background: #090d16;
      border: 1px solid #263349;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-height: 120px;
    }

    .live-card-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-sub);
      border-bottom: 1px solid #1e293b;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    .live-card-header code {
      color: var(--accent);
      font-weight: 700;
    }

    .live-glyph-text {
      word-break: break-all;
      line-height: 1.25;
      margin: auto 0;
      user-select: all;
    }

    /* 區塊標題 */
    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title span.sub {
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--text-sub);
    }

    /* 差異字展示列 */
    .char-showcase {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .char-row {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 16px;
      display: grid;
      grid-template-columns: 230px 1fr;
      gap: 16px;
      align-items: center;
    }

    @media (max-width: 820px) {
      .char-row {
        grid-template-columns: 1fr;
      }
    }

    .char-info {
      border-right: 1px solid var(--card-border);
      padding-right: 16px;
    }

    @media (max-width: 820px) {
      .char-info {
        border-right: none;
        border-bottom: 1px solid var(--card-border);
        padding-right: 0;
        padding-bottom: 12px;
      }
    }

    .char-info .title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .char-info .unicode {
      font-size: 0.78rem;
      font-family: monospace;
      color: var(--text-sub);
      background: #090d16;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .char-info .feature-desc {
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-top: 6px;
    }

    .region-boxes {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    @media (max-width: 600px) {
      .region-boxes {
        grid-template-columns: repeat(auto-fit, minmax(95px, 1fr));
      }
    }

    .region-card {
      background: #090d16;
      border: 1px solid #263349;
      border-radius: 8px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .region-label {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 6px;
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .region-label code {
      color: var(--accent);
      font-weight: 700;
    }

    .glyph-display {
      font-size: 72px;
      line-height: 1.1;
      margin: 4px 0;
      user-select: all;
    }

    .font-sans {
      font-family: sans-serif !important;
    }

    .font-serif {
      font-family: serif !important;
    }

    .region-note {
      font-size: 0.74rem;
      color: #94a3b8;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>漢字五方：CJK 跨地域字形一覽與即時測試</h1>
        <p class="desc">
          不指定任何特定字型名稱，純粹透過 HTML 原生 <code>lang</code> 屬性（<code>zh-TW</code> / <code>zh-CN</code> / <code>ja</code> / <code>ko</code> / <code>zh-HK</code>）展示五地書寫差異。
        </p>
      </div>
      <div class="toolbar">
        <button id="btn-sans" class="active" onclick="setGenericFamily('sans-serif')">無襯線黑體 (sans-serif)</button>
        <button id="btn-serif" onclick="setGenericFamily('serif')">有襯線明/宋體 (serif)</button>
      </div>
    </header>

    <!-- 自訂文字即時測試面板 -->
    <section class="custom-tester">
      <div class="tester-controls">
        <div class="input-wrapper">
          <label for="custom-input">自訂測試文字：</label>
          <input type="text" id="custom-input" value="遲眾聽經亮以角沒化骨麵房空" placeholder="請輸入任意漢字進行五地字形比對...">
        </div>
        <div class="size-wrapper">
          <label for="size-slider">字級大小：</label>
          <input type="range" id="size-slider" min="28" max="110" value="48">
          <span id="size-val">48px</span>
        </div>
      </div>
      <div id="live-grid" class="live-preview-grid"></div>
    </section>

    <!-- 20 組經典 CJK 差異漢字一覽 -->
    <div class="section-title">
      <span>代表性漢字五地書寫差異圖鑑（共 20 字）</span>
      <span class="sub">點擊卡片內文字可直接選取複製</span>
    </div>
    <main id="showcase-container" class="char-showcase"></main>
  </div>

  <script>
    let currentFamily = 'sans-serif';
    let currentTestSize = 48;

    const REGIONS = [
      { code: 'zh-TW', label: '台灣' },
      { code: 'zh-CN', label: '中國' },
      { code: 'ja',    label: '日本' },
      { code: 'ko',    label: '韓國' },
      { code: 'zh-HK', label: '香港' }
    ];

    // 精選 20 個同一個 Unicode 碼位、但在台/中/日/韓/港有鮮明筆形差異的代表字
    const CHAR_DATA = [
      {
        char: '骨',
        code: 'U+9AA8',
        feature: '上方骨頭內部方向與下方「月（肉）」首筆',
        notes: {
          'zh-TW': '上內右折・下首筆豎',
          'zh-CN': '上內左折・下首筆豎',
          'ja':    '上內左折・下首筆豎',
          'ko':    '上內右折・下首筆撇',
          'zh-HK': '上內右折・下首筆撇'
        }
      },
      {
        char: '角',
        code: 'U+89D2',
        feature: '下半部「用」中央的豎筆是否向下穿透底橫',
        notes: {
          'zh-TW': '中豎不穿透底橫',
          'zh-CN': '中豎向下穿透出頭',
          'ja':    '中豎不穿透底橫',
          'ko':    '中豎不穿透底橫',
          'zh-HK': '中豎不穿透底橫'
        }
      },
      {
        char: '空',
        code: 'U+7A7A',
        feature: '穴字頭下方兩筆是「八（撇、點）」還是「儿（撇、豎彎）」',
        notes: {
          'zh-TW': '穴下為「八」（撇＋長頓點）',
          'zh-CN': '穴下為「儿」（撇＋豎折鉤）',
          'ja':    '穴下為「儿」（撇＋豎彎）',
          'ko':    '穴下為「八」（撇＋點）',
          'zh-HK': '穴下為「八」（撇＋點）'
        }
      },
      {
        char: '亮',
        code: 'U+4EAE',
        feature: '首筆點/橫、禿寶蓋「冖」下方的「儿」與「几」結構',
        notes: {
          'zh-TW': '上點・下方為「儿」（撇＋豎彎鉤）',
          'zh-CN': '上點・下方為「几」（橫折彎鉤）',
          'ja':    '下方「几」橫筆常與冖相接或緊靠',
          'ko':    '上點・下方為傳統「儿」結構',
          'zh-HK': '上點・下方為「儿」結構'
        }
      },
      {
        char: '以',
        code: 'U+4EE5',
        feature: '左側首筆是「豎折」還是「豎提」，以及中間點畫高低',
        notes: {
          'zh-TW': '左為豎折（提筆不穿出）',
          'zh-CN': '左為豎提（下端折角銳利）',
          'ja':    '左為豎提・整體重心偏開闊',
          'ko':    '左筆下端與提筆交接微出',
          'zh-HK': '左為傳統豎提結構'
        }
      },
      {
        char: '沒',
        code: 'U+6C92',
        feature: '右上方部件是「刀/勹（橫折鉤＋內撇）」還是「几」',
        notes: {
          'zh-TW': '右上為「勹」包內撇（無右彎鉤）',
          'zh-CN': '右上作「几」（撇＋橫折彎）',
          'ja':    '右上作「几」（撇＋橫折彎鉤）',
          'ko':    '右上作「几」（撇＋橫折彎鉤）',
          'zh-HK': '右上作「几」（撇＋橫折彎鉤）'
        }
      },
      {
        char: '化',
        code: 'U+5316',
        feature: '右側「匕」的撇畫是否穿透豎彎鉤',
        notes: {
          'zh-TW': '右撇起於豎筆頂端（不穿透）',
          'zh-CN': '右撇斜向穿透豎彎鉤',
          'ja':    '右撇斜向穿透豎彎鉤',
          'ko':    '右撇斜向穿透豎彎鉤',
          'zh-HK': '右撇接於豎筆（多不穿透）'
        }
      },
      {
        char: '房',
        code: 'U+623F',
        feature: '上方「戶」首筆（點/撇/橫）與下方「方」橫折鉤起筆位置',
        notes: {
          'zh-TW': '戶首筆點・方橫折鉤自中起筆',
          'zh-CN': '戶首筆點・方撇直接自橫起',
          'ja':    '戶首筆長橫（戸）・方自橫下起折',
          'ko':    '戶首筆斜撇・傳統康熙結體',
          'zh-HK': '戶首筆短撇・傳統結體'
        }
      },
      {
        char: '眾',
        code: 'U+773E',
        feature: '下方三人（乑）中央與左右筆畫的連接關係',
        notes: {
          'zh-TW': '下方中豎改為三撇交疊',
          'zh-CN': '下方中為豎筆連下撇捺',
          'ja':    '下方中為豎筆連下撇捺',
          'ko':    '下方中為豎筆（傳統乑形）',
          'zh-HK': '下方中為豎筆（傳統乑形）'
        }
      },
      {
        char: '遲',
        code: 'U+9072',
        feature: '內部「犀」的牛部中豎與走之底「辶」點數及彎度',
        notes: {
          'zh-TW': '單點辶・下方雙折彎',
          'zh-CN': '單點辶・橫折折撇',
          'ja':    '單點辶・平滑單弧彎',
          'ko':    '雙點辶（傳統兩點走之）',
          'zh-HK': '單點辶・傳統港標折彎'
        }
      },
      {
        char: '聽',
        code: 'U+807D',
        feature: '左「耳」下橫出頭、「壬」首筆，以及右「心」底部臥鉤形狀',
        notes: {
          'zh-TW': '耳下提筆・下為壬・標準心底',
          'zh-CN': '耳下提筆・心底臥鉤較平',
          'ja':    '耳下橫穿出・傳統旧字體結構',
          'ko':    '耳下橫穿出・心部挑鉤明顯',
          'zh-HK': '耳下長提・傳統常用字體'
        }
      },
      {
        char: '經',
        code: 'U+7D93',
        feature: '左「糹」底部是三點還是「小」，以及右上「巛」是三折還是三豎弧',
        notes: {
          'zh-TW': '糹底為三點・右上為三折「巛」',
          'zh-CN': '糹底三點・右上為三撇弧筆',
          'ja':    '糹底為「小」・右上隨字形規範',
          'ko':    '糹底為「小」・右上傳統「巛」',
          'zh-HK': '糹底為「小」・右上為三折「巛」'
        }
      },
      {
        char: '麵',
        code: 'U+9EB5',
        feature: '左「麥」中豎是否穿透至下方「夂」，以及右「面」內部線條',
        notes: {
          'zh-TW': '麥上中豎不穿入下「夂」',
          'zh-CN': '麥字結構與右側「面」橫接',
          'ja':    '麥部依日文漢字筆勢收攏',
          'ko':    '傳統麥部・右下「面」框飽滿',
          'zh-HK': '傳統港標麥部與面字結構'
        }
      },
      {
        char: '直',
        code: 'U+76F4',
        feature: '下方末筆長橫與左側豎筆的組合結構',
        notes: {
          'zh-TW': '下橫與上目相連無左豎',
          'zh-CN': '下橫與上目相連無左豎',
          'ja':    '左側帶L形豎折托底',
          'ko':    '左側帶L形豎折托底',
          'zh-HK': '左側帶L形豎折托底'
        }
      },
      {
        char: '刃',
        code: 'U+5203',
        feature: '左側點畫與刀部撇畫的交接方式',
        notes: {
          'zh-TW': '點向右下（不穿撇）',
          'zh-CN': '點向右下穿過撇畫',
          'ja':    '左側為短右斜點',
          'ko':    '點穿過撇畫',
          'zh-HK': '點向右下（不穿撇）'
        }
      },
      {
        char: '草',
        code: 'U+8349',
        feature: '上方「艹（艸部）」是相連還是斷開為十十',
        notes: {
          'zh-TW': '四畫斷開（十＋十）',
          'zh-CN': '三畫一體橫連',
          'ja':    '三畫一體橫連',
          'ko':    '四畫傳統兩段式',
          'zh-HK': '四畫傳統兩段式'
        }
      },
      {
        char: '雪',
        code: 'U+96EA',
        feature: '雨字頭內部四點方向與下方「彐」字形',
        notes: {
          'zh-TW': '四點斜向・中橫不出頭',
          'zh-CN': '四點短橫・中橫不出頭',
          'ja':    '中橫不穿透右折',
          'ko':    '傳統雨頭・右折微出',
          'zh-HK': '傳統雨頭點畫'
        }
      },
      {
        char: '器',
        code: 'U+5668',
        feature: '中央部位是「犬（有一點）」還是「大（無點）」',
        notes: {
          'zh-TW': '中央為「犬」（有右點）',
          'zh-CN': '中央為「大」（無點）',
          'ja':    '中央為「大」（無點）',
          'ko':    '中央為「犬」（有右點）',
          'zh-HK': '中央為「犬」（有右點）'
        }
      },
      {
        char: '真',
        code: 'U+771F',
        feature: '上方是「十」或「匕」，以及內部與左豎連結關係',
        notes: {
          'zh-TW': '上為十・下橫直接連目',
          'zh-CN': '上為十・下橫直接連目',
          'ja':    '上為十・左側帶豎折框',
          'ko':    '傳統常作眞（上匕）',
          'zh-HK': '上為十・左側帶豎折框'
        }
      },
      {
        char: '道',
        code: 'U+9053',
        feature: '走之底（辶）左側點畫數與首部「首」內筆形',
        notes: {
          'zh-TW': '一點・下方雙折彎',
          'zh-CN': '一點・橫折折撇',
          'ja':    '一點・平滑單折彎',
          'ko':    '二點（傳統雙點辶）',
          'zh-HK': '一點・傳統書寫折彎'
        }
      }
    ];

    function renderLiveTester() {
      const text = document.getElementById('custom-input').value || '骨';
      const grid = document.getElementById('live-grid');
      const familyClass = currentFamily === 'sans-serif' ? 'font-sans' : 'font-serif';

      grid.innerHTML = REGIONS.map(r => `
        <div class="live-card">
          <div class="live-card-header">
            <span>${r.label}標準</span>
            <code>lang="${r.code}"</code>
          </div>
          <div class="live-glyph-text ${familyClass}" lang="${r.code}" style="font-size: ${currentTestSize}px;"></div>
        </div>
      `).join('');

      // 使用 textContent 安全注入使用者輸入文字
      const textNodes = grid.querySelectorAll('.live-glyph-text');
      textNodes.forEach(node => {
        node.textContent = text;
      });
    }

    function renderShowcase() {
      const container = document.getElementById('showcase-container');
      const familyClass = currentFamily === 'sans-serif' ? 'font-sans' : 'font-serif';

      container.innerHTML = CHAR_DATA.map(item => {
        const cardsHtml = REGIONS.map(r => `
          <div class="region-card">
            <div class="region-label">
              <span>${r.label}</span>
              <code>${r.code}</code>
            </div>
            <div class="glyph-display ${familyClass}" lang="${r.code}">${item.char}</div>
            <div class="region-note">${item.notes[r.code]}</div>
          </div>
        `).join('');

        return `
          <div class="char-row">
            <div class="char-info">
              <div class="title">
                <span>「${item.char}」</span>
                <span class="unicode">${item.code}</span>
              </div>
              <div class="feature-desc">${item.feature}</div>
            </div>
            <div class="region-boxes">
              ${cardsHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    function setGenericFamily(family) {
      currentFamily = family;
      document.getElementById('btn-sans').classList.toggle('active', family === 'sans-serif');
      document.getElementById('btn-serif').classList.toggle('active', family === 'serif');
      renderLiveTester();
      renderShowcase();
    }

    window.addEventListener('DOMContentLoaded', () => {
      const inputEl = document.getElementById('custom-input');
      const sliderEl = document.getElementById('size-slider');
      const sizeValEl = document.getElementById('size-val');

      inputEl.addEventListener('input', renderLiveTester);
      sliderEl.addEventListener('input', (e) => {
        currentTestSize = e.target.value;
        sizeValEl.textContent = `${currentTestSize}px`;
        renderLiveTester();
      });

      renderLiveTester();
      renderShowcase();
    });
  </script>
</body>
</html>
